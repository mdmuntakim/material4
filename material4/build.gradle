plugins {
    id 'com.android.library'
}

android {
    namespace 'io.material4'
    compileSdk 36

    defaultConfig {
        minSdk 26
        consumerProguardFiles 'consumer-rules.pro'
    }

    buildFeatures {
        buildConfig false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

dependencies {
    api 'com.google.android.material:material:1.14.0'
    api 'androidx.appcompat:appcompat:1.8.0'
    api 'androidx.core:core:1.17.0'
    api 'androidx.activity:activity:1.13.0'
    api 'androidx.fragment:fragment:1.9.1'
    api 'androidx.recyclerview:recyclerview:1.4.0'
    api 'androidx.viewpager2:viewpager2:1.1.0'
    api 'androidx.constraintlayout:constraintlayout:2.2.2'
    api 'androidx.drawerlayout:drawerlayout:1.2.0'
    api 'androidx.dynamicanimation:dynamicanimation:1.1.0'
    api 'androidx.transition:transition:1.7.2'
    api 'androidx.window:window:1.5.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.18'
    testImplementation 'androidx.test:core:1.7.0'
    testImplementation 'androidx.test.ext:junit:1.3.0'
}
